name: Daily brief

on:
  schedule:
    # 09:00 IST = 03:30 UTC. Adjust to your timezone (cron is always UTC).
    - cron: "30 3 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # allow committing the brief + dedup state back to the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Problembrief
        env:
          # Hardcoded to OpenAI (out of Claude credit). To switch back to Claude,
          # change this line to `RADAR_PROVIDER: anthropic`.
          RADAR_PROVIDER: openai
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Built-in token raises the GitHub Issues search rate limit, for free.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.main

      - name: Commit brief + dedup state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs state
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily brief $(date -u +%F)"
            git push
          fi
