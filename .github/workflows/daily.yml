name: Daily brief

on:
  schedule:
    # 09:00 IST = 03:30 UTC. Adjust to your timezone (cron is always UTC).
    - cron: "30 3 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # allow committing the brief + dedup state back to the repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the commit-back step can rebase

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Problembrief
        env:
          # Set these in Settings → Secrets and variables → Actions → Variables.
          # Falls back to Anthropic if RADAR_PROVIDER is not configured.
          RADAR_PROVIDER: ${{ vars.RADAR_PROVIDER || 'anthropic' }}
          RADAR_MODEL: ${{ vars.RADAR_MODEL || 'claude-opus-4-8' }}
          RADAR_OPENAI_MODEL: ${{ vars.RADAR_OPENAI_MODEL || 'gpt-4o' }}
          RADAR_GEMINI_MODEL: ${{ vars.RADAR_GEMINI_MODEL || 'gemini-2.5-flash' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Live market research for the buildability theses (free tier: tavily.com).
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Built-in token raises the GitHub Issues search rate limit, for free.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.main

      - name: Commit brief + dedup state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs state
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily brief $(date -u +%F)"
          # The remote may have moved on (you pushed, or a prior run committed). Rebase
          # our commit on top and retry; prefer our freshly generated files on conflict.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin master && git push origin master; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed; retrying…"
            sleep 5
          done
          echo "could not push after 3 attempts" >&2
          exit 1
